spring.application.name=backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/siso}
spring.datasource.username=${DATABASE_USER:siso}
spring.datasource.password=${DATABASE_PASSWORD:siso_dev_only}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.ip-hash-salt=${IP_HASH_SALT:local-dev-only-salt}
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.anon.signing-secret=${ANON_ID_SIGNING_SECRET}
app.assembly.api-key=${ASSEMBLY_API_KEY:}
app.petition.sync-interval-ms=${PETITION_SYNC_INTERVAL_MS:1800000}
app.retention.purge-interval-ms=${RETENTION_PURGE_INTERVAL_MS:86400000}
app.moderation.openrouter-api-key=${OPENROUTER_API_KEY:}
app.moderation.llm-classify-interval-ms=${LLM_CLASSIFY_INTERVAL_MS:1800000}
app.newsletter.resend-api-key=${RESEND_API_KEY:}
app.newsletter.from-address=${NEWSLETTER_FROM_ADDRESS:onboarding@resend.dev}
app.newsletter.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.newsletter.send-cron=${NEWSLETTER_SEND_CRON:0 0 9 * * MON}
app.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
app.recaptcha.min-score=${RECAPTCHA_MIN_SCORE:0.5}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# ResponseStatusException의 reason이 프론트 에러 메시지로 그대로 노출됨(5절
# "사유 안내") — 전부 의도적으로 사용자에게 보여줄 한글 메시지로 작성한
# 것들이라 always로 켜도 안전. 스택트레이스는 여전히 안 나감.
# Boot 4.0부터 server.error.include-message가 deprecated되고
# spring.web.error.include-message로 바뀜(context7 공식문서로 확인).
spring.web.error.include-message=always

# UptimeRobot 등 외부 헬스체크용 — 인증 없이 접근 가능하니 health 외 다른
# actuator 엔드포인트(env/beans 등 내부 정보 노출)는 절대 추가하지 말 것.
# show-details=never로 DB/Redis 연결 세부정보가 응답에 안 실리게 함.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# 비어있으면(미설정) Sentry SDK가 스스로 비활성화됨(공식 동작) — 계정 생성
# 전까지는 조용히 꺼져 있는 다른 선택적 연동과 동일한 패턴.
sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}
sentry.environment=${SENTRY_ENVIRONMENT:production}
